<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img">
  <title>whoami</title>
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160A24"/>
      <stop offset="100%" stop-color="#0C0614"/>
    </linearGradient>
  </defs>
  <style>
    .ln { animation: rise 0.5s ease both; }
    .d1 { animation-delay: 0.12s; }
    .d2 { animation-delay: 0.42s; }
    .d3 { animation-delay: 0.78s; }
    .d4 { animation-delay: 1.12s; }
    .d5 { animation-delay: 1.5s; }
    .d6 { animation-delay: 1.84s; }
    .d7 { animation-delay: 2.14s; }
    .d8 { animation-delay: 2.42s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; }
    }
  </style>
  <rect width="960" height="360" rx="22" fill="url(#term)" stroke="#6D28D9" stroke-width="1.5"/>
  <rect width="960" height="48" rx="22" fill="#1C0E32"/>
  <rect y="28" width="960" height="20" fill="#1C0E32"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="24" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="24" r="6" fill="#28C840"/>
  <text x="480" y="29" text-anchor="middle" fill="#C4B5FD" font-family="Consolas, Courier New, monospace" font-size="13">facundo@ghost — ~/whoami</text>
  <g font-family="Cascadia Mono, Consolas, Courier New, monospace" font-size="16">
    <text class="ln d1" x="36" y="88">
      <tspan fill="#F0ABFC">facundo</tspan><tspan fill="#E879F9">@</tspan><tspan fill="#C084FC">ghost</tspan><tspan fill="#A78BFA">:~$</tspan><tspan fill="#F8F7FF"> whoami</tspan>
    </text>
    <text class="ln d2" x="36" y="122" fill="#FFFFFF" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Breno Facundo</text>
    <text class="ln d3" x="36" y="166">
      <tspan fill="#F0ABFC">facundo</tspan><tspan fill="#E879F9">@</tspan><tspan fill="#C084FC">ghost</tspan><tspan fill="#A78BFA">:~$</tspan><tspan fill="#F8F7FF"> id</tspan>
    </text>
    <text class="ln d4" x="36" y="198" fill="#DDD6FE">uid=22(pentester) gid=shadow groups=recon,web,rede</text>
    <text class="ln d5" x="36" y="242">
      <tspan fill="#F0ABFC">facundo</tspan><tspan fill="#E879F9">@</tspan><tspan fill="#C084FC">ghost</tspan><tspan fill="#A78BFA">:~$</tspan><tspan fill="#F8F7FF"> cat about.txt</tspan>
    </text>
    <text class="ln d6" x="36" y="274" fill="#DDD6FE">Pentester.</text>
    <text class="ln d7" x="36" y="300" fill="#DDD6FE">Mapeio a superfície, acho a falha e deixo a prova.</text>
    <text class="ln d8" x="36" y="326" fill="#DDD6FE">O resto é silêncio.</text>
  </g>
  <rect x="232" y="312" width="10" height="16" rx="1" fill="#E879F9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
