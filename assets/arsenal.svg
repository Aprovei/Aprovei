    <text x="364" y="122" text-anchor="middle" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="14">Nuclei</text>
  </g>
  <text x="36" y="168" fill="#E879F9" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.6">REDE</text>
  <g class="pill a4">
    <rect x="36" y="182" width="100" height="38" rx="19" fill="#1A0B2E" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="86" y="206" text-anchor="middle" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="14">Nmap</text>
  </g>
  <g class="pill a5">
    <rect x="148" y="182" width="140" height="38" rx="19" fill="#1A0B2E" stroke="#E879F9" stroke-width="1.5"/>
