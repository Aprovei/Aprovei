  </g>
  <rect x="520" y="168" width="8" height="8" rx="2" fill="#E879F9">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="538" y="176" fill="#DDD6FE" font-family="Consolas, Courier New, monospace" font-size="13">shadow@scope</text>
  <text x="36" y="236" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="14">Kali por perto. Evidência no final.</text>
</svg>
