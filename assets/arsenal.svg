<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img">
  <title>Arsenal</title>
  <style>
    .pill { animation: rise 0.45s ease both; }
    .a1 { animation-delay: 0.04s; }
    .a2 { animation-delay: 0.12s; }
    .a3 { animation-delay: 0.2s; }
    .a4 { animation-delay: 0.28s; }
    .a5 { animation-delay: 0.36s; }
    .a6 { animation-delay: 0.44s; }
    .a7 { animation-delay: 0.16s; }
    .a8 { animation-delay: 0.24s; }
    .a9 { animation-delay: 0.36s; }
    .a10 { animation-delay: 0.44s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pill { animation: none; }
    }
  </style>
  <rect width="960" height="268" rx="22" fill="#0C0614" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="36" y="42" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="22">&gt; arsenal</text>
  <text x="168" y="42" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="14">o kit de quando o escopo abre</text>
  <text x="36" y="84" fill="#E879F9" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.6">WEB</text>
  <g class="pill a1">
    <rect x="36" y="98" width="156" height="38" rx="19" fill="#1A0B2E" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="114" y="122" text-anchor="middle" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="14">Burp Suite</text>
  </g>
  <g class="pill a2">
    <rect x="204" y="98" width="92" height="38" rx="19" fill="#1A0B2E" stroke="#E879F9" stroke-width="1.5"/>
    <text x="250" y="122" text-anchor="middle" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="14">ffuf</text>
  </g>
  <g class="pill a3">
