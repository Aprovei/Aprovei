    <text x="375" y="206" text-anchor="middle" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="14">Metasploit</text>
  </g>
  <text x="520" y="84" fill="#E879F9" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.6">LAB</text>
  <g class="pill a7">
