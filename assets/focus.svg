<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img">
  <title>Foco</title>
  <rect width="900" height="300" rx="22" fill="#0C0614" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="32" y="42" fill="#F8F7FF" font-family="Consolas, Courier New, monospace" font-size="22">&gt; foco</text>
  <rect x="28" y="64" width="410" height="100" rx="16" fill="#140A22" stroke="#3B0764"/>
  <text x="52" y="104" fill="#F8F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Recon</text>
  <text x="52" y="134" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="15">Superfície, ativo e o que vaza.</text>
  <rect x="462" y="64" width="410" height="100" rx="16" fill="#140A22" stroke="#3B0764"/>
  <text x="486" y="104" fill="#F8F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Web</text>
  <text x="486" y="134" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="15">Auth, lógica e input.</text>
  <rect x="28" y="180" width="410" height="100" rx="16" fill="#140A22" stroke="#3B0764"/>
  <text x="52" y="220" fill="#F8F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Rede</text>
  <text x="52" y="250" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="15">Serviço e caminho lateral.</text>
  <rect x="462" y="180" width="410" height="100" rx="16" fill="#140A22" stroke="#3B0764"/>
  <text x="486" y="220" fill="#F8F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Prova</text>
  <text x="486" y="250" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="15">Do achado ao relatório.</text>
</svg>
